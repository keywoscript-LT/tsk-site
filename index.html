<style>
:root{--cy:#00F0FF;--rd:#FF2E63}*{-webkit-tap-highlight-color:transparent}
html{scrollbar-color:#243044 #07090E}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#243044;border-radius:6px}
body{background:#07090E;color:#eef1f6;font-family:Inter,system-ui,sans-serif;min-height:100dvh;overflow-x:hidden;background-image:radial-gradient(520px 300px at 85% -5%,#FF2E6322,transparent),radial-gradient(520px 340px at 0 40%,#00F0FF10,transparent)}
.g{background:rgba(15,20,28,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);border-radius:14px;transition:all .2s ease;box-shadow:0 8px 24px -14px #000}
.g.r:hover,.pc:hover{border-color:rgba(0,240,255,.35);box-shadow:0 0 24px -8px rgba(0,240,255,.45)}.g.r:active,.pc:active{transform:scale(.97)}
.logo{filter:drop-shadow(0 0 8px #FF2E6399)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,#00F0FF,#5df5ff);color:#07090E;font-weight:800;padding:.5rem .9rem;border-radius:10px;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;transition:all .2s}
.btn:hover{box-shadow:0 0 20px #00F0FF88}.btn:active{transform:scale(.95)}.btn.r{background:linear-gradient(135deg,#FF2E63,#ff6b8b);color:#fff}.btn.k{background:rgba(255,255,255,.08);color:#dfe5ef;border:1px solid rgba(255,255,255,.1)}
.inp{display:block;width:100%;margin-top:3px;background:#0a0d13;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:.5rem .65rem;color:#fff;font-size:16px;transition:.2s}.inp:focus{outline:0;border-color:var(--cy);box-shadow:0 0 0 3px #00F0FF22}
.fd{animation:fd .3s ease both}@keyframes fd{from{opacity:0;transform:translateY(8px)}}
.zi{animation:zi .22s ease both}@keyframes zi{from{opacity:0;transform:scale(.95)}}
.su{animation:su .28s cubic-bezier(.2,.8,.2,1) both}@keyframes su{from{opacity:.4;transform:translateY(40px)}}
.live{color:var(--rd);animation:b 1.2s infinite}@keyframes b{50%{opacity:.4}}
.ic{width:1.15em;height:1.15em;fill:currentColor;stroke:none;flex-shrink:0}
.tab{display:flex;align-items:center;gap:6px;padding:.5rem .8rem;border-radius:10px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#8c97ab;transition:all .2s}
.tab:hover{color:#fff}.tab.on{color:var(--cy);background:rgba(0,240,255,.08);box-shadow:inset 0 0 0 1px rgba(0,240,255,.25)}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;font-size:9.5px;font-weight:600;letter-spacing:.04em;color:#6f7a8f;position:relative;transition:all .2s}.bn:active{transform:scale(.9)}
.bn.on{color:var(--cy)}.bn.on .ic{filter:drop-shadow(0 0 6px #00F0FF)}.bn.on:before{content:"";position:absolute;top:-1px;width:26px;height:2px;border-radius:2px;background:var(--rd);box-shadow:0 0 10px var(--rd)}
.cut{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.edge{background:linear-gradient(135deg,rgba(0,240,255,.55),rgba(255,255,255,.07) 45%,rgba(255,46,99,.55));padding:1px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.rip{width:8px;height:8px;border-radius:50%;background:#FF2E63;display:inline-block;position:relative;flex-shrink:0}

/* Живое обновление кубков при открытии карточки (не чаще 1 раза в минуту на игрока) */
const _bsT={},bsNorm=v=>{const t=String(v||'').toUpperCase().replace(/O/g,'0').replace(/[^0289PYLQGRJCUV]/g,'');return t?'#'+t:''};
async function bsRefresh(p){
 try{
  if(typeof sb==='undefined'||!sb||!p||!/^#[0289PYLQGRJCUV]{3,14}$/.test(String(p.bsTag||'')))return;
  if(Date.now()-(_bsT[p.id]||0)<60000)return;_bsT[p.id]=Date.now();
  const r=await fetch(SB_URL+'/functions/v1/bs-sync?player='+encodeURIComponent(p.id),{method:'POST',headers:{apikey:SB_KEY}});
  if(!r.ok)return;const j=await r.json(),n=+j.trophies;
  if(!Number.isFinite(n)||n<=0)return;
  p.bsTrophies=n;
  const b=document.getElementById('bsTrBox');
  if(b&&b.dataset.pid==String(p.id))b.innerHTML=bsTile(BS_TROPHY_SVG,R('Кубки Brawl Stars','Brawl Stars trophies'),n.toLocaleString('ru-RU'),'#FFB020');
 }catch(e){}
}
function openP(id){const p=DB.players.find(x=>x.id==id);if(!p)return;const tt=tm(p.team),h=hue(p.nick),ms=DB.matches.filter(m=>m.st=='fin'&&(m.a==p.team||m.b==p.team)).sort((x,y)=>new Date(y.when)-new Date(x.when)),
rk=[...DB.players].sort((a,b)=>b.pps-a.pps).findIndex(x=>x.id==p.id)+1,wins=ms.filter(m=>(m.a==p.team?m.sa>m.sb:m.sb>m.sa)).length,
hs=(p.hist||[]).filter(x=>x&&Number.isFinite(+x.v)),trs=allTr(p),golds=trs.filter(x=>x.p==1).length,
mates=p.team?DB.players.filter(x=>x.team==p.team&&x.id!=p.id):[],dl=hs.length>1?hs[hs.length-1].v-hs[0].v:0,

else if(q.length==1){const t=q[0].filter(Boolean);if(t.length>1)pr.push([t[0],t[1]])}

const RULES=[
['Общие положения','General','Регистрируясь на сайте, ты соглашаешься с этими правилами. Один человек — один аккаунт. Указывай о себе достоверные данные. Незнание правил от ответственности не освобождает.','By registering you agree to these rules. One person — one account. Provide truthful information. Not knowing the rules does not excuse a violation.'],
['Уважение к людям','Respect','Запрещены оскорбления игроков, стаффа, команд и организации, травля, угрозы, дискриминация по любому признаку, провокации и токсичное поведение — на сайте, в профиле и в связанных чатах. Оскорбление стаффа — одно из самых серьёзных нарушений.','Insults toward players, staff, teams or the organization, harassment, threats, discrimination of any kind, baiting and toxic behavior are forbidden — on the site, in profiles and in linked chats. Insulting staff is among the most serious violations.'],
['Честная игра','Fair play','Запрещены читы и сторонний софт, договорные матчи, накрутка статистики и очков, мультиаккаунты, обман администрации и выдача себя за стафф.','Cheats and third-party software, match-fixing, stat or points boosting, multiple accounts, deceiving staff and impersonating staff are forbidden.'],
['Профиль и контент','Profile & content','Ник, фото, логотип, название команды, био и цитата не должны содержать оскорблений, шок-контента, 18+, рекламы, чужих личных данных и имитации ников стаффа. Такой контент удаляется, а заявки на изменение отклоняются.','Nicks, photos, logos, team names, bios and quotes must not contain insults, shock content, 18+ material, ads, other people’s personal data or imitation of staff names. Such content is removed and edit requests are rejected.'],
['Команды и трансферы','Teams & transfers','Один аккаунт может зарегистрировать только одну команду и один профиль игрока. Запрещены спам приглашениями, давление на игроков и манипуляции при трансферах. Менеджер и капитан отвечают за поведение своей команды.','One account may register only one team and one player profile. Invitation spam, pressure on players and transfer manipulation are forbidden. Managers and captains are responsible for their team’s conduct.'],
['Наказания','Penalties','За нарушения стафф может вынести предупреждение, удалить контент или заблокировать аккаунт на срок от 1 часа до 30 дней, а за грубые и повторные нарушения — навсегда. Во время бана нельзя подавать заявки, менять профиль, отправлять и принимать приглашения. Срок и причина видны в твоём профиле.','Staff may issue a warning, remove content or ban an account from 1 hour to 30 days — permanently for severe or repeated violations. While banned you cannot apply, edit your profile, or send/accept invitations. The reason and duration are shown in your profile.'],
['Обжалование','Appeals','Если ты считаешь наказание ошибочным, свяжись со стаффом организации через официальные каналы и приведи факты. Решение по апелляции принимает администрация.','If you believe a penalty is a mistake, contact the organization’s staff through official channels with facts. Appeals are decided by the administration.']];

<script>
(()=>{
/* ---------- переводы новых строк ---------- */
try{
 Object.assign(XL.uk,{'Следующий матч':'Наступний матч','Далее':'Далі','Матч за 3-е место':'Матч за 3-є місце','Полуфинал':'Півфінал','Четвертьфинал':'Чвертьфінал','1/8 финала':'1/8 фіналу','1/16 финала':'1/16 фіналу','Финал':'Фінал','Плей-офф':'Плей-оф','Сетка плей-офф':'Сітка плей-оф','Открыть':'Відкрити','Закрыть':'Закрити'});
 Object.assign(XL.kk,{'Следующий матч':'Келесі матч','Далее':'Келесі','Матч за 3-е место':'3-орын үшін матч','Полуфинал':'Жартылай финал','Четвертьфинал':'Ширек финал','1/8 финала':'1/8 финал','1/16 финала':'1/16 финал','Финал':'Финал','Плей-офф':'Плей-офф','Сетка плей-офф':'Плей-офф торы','Открыть':'Ашу','Закрыть':'Жабу'});
}catch(e){}

/* ---------- помощники ---------- */
const sc=s=>{const m=String(s==null?'':s).match(/(\d+)\D+(\d+)/);return m?[+m[1],+m[2]]:null};
const kind=r=>{const s=String(r||'');
 if(/third|3rd|бронз|3[\s-]*(е|й|го)?\s*мест|за\s*3/i.test(s))return{k:'3',w:90};
 if(/semi|полуфин|півфін|1\/2/i.test(s))return{k:'sf',w:60};
 if(/quarter|четверт|чвертьф|1\/4/i.test(s))return{k:'qf',w:50};
 if(/1\/16|round of 32|last 32/i.test(s))return{k:'r32',w:30};
 if(/1\/8|round of 16|last 16/i.test(s))return{k:'r16',w:40};
 if(/^\s*(grand\s*)?(final|финал|фінал)\s*$/i.test(s))return{k:'f',w:80};
 return{k:'',w:null}};
const rlab=r=>{const k=kind(r).k;
 return k=='3'?R('Матч за 3-е место','Third place'):k=='sf'?R('Полуфинал','Semifinal'):k=='qf'?R('Четвертьфинал','Quarterfinal'):k=='r32'?R('1/16 финала','Round of 32'):k=='r16'?R('1/8 финала','Round of 16'):k=='f'?R('Финал','Final'):String(r||'')};
const split=po=>{const rs=[];po.forEach(y=>{let g=rs.find(z=>z.r==y.r);if(!g)rs.push(g={r:y.r,m:[]});g.m.push(y)});
 let third=rs.filter(g=>kind(g.r).k=='3'),main=rs.filter(g=>kind(g.r).k!='3');
 if(!main.length){main=third;third=[]}
 if(main.length>1&&main.every(g=>kind(g.r).w!=null))main.sort((a,b)=>kind(a.r).w-kind(b.r).w);
 return{main,third}};
const oc=T=>T?`onclick="openT('${esc(String(T.id))}')"`:'';

/* ---------- матч в сетке ---------- */
const row=(n,v,st,extra)=>{const tt=tnm(n);
 return`<div class="bk-t ${st}" data-tn="${esc(n)}" ${oc(tt)}>${lg(tt||{name:n},'h-5 w-5')}<span class="n">${esc(n)}</span>${extra||''}<b class="sc">${v}</b></div>`};
const mt=(y,o)=>{const p=sc(y.s),wa=p&&p[0]>p[1],wb=p&&p[1]>p[0],cup=`<span class="tr">${ic('cup')}</span>`;
 return`<div class="bk-m ${o.nx?'nx':''} ${o.f?'fin':''} ${o.li?'li':''}">${o.nx?`<i class="bk-tag">${R('Далее','Next')}</i>`:''}${row(y.a,p?p[0]:'–',wa?'w':wb?'l':'',wa&&o.f?cup:'')}${row(y.b,p?p[1]:'–',wb?'w':wa?'l':'',wb&&o.f?cup:'')}</div>`};

/* ---------- сетка ---------- */
const bracket=(id,po,nx)=>{
 const{main,third}=split(po),n=main.length,cnt=main.map(g=>g.m.length);
 if(!n)return`<p class="tn-empty">${t('none')}</p>`;
 const act=main.findIndex(g=>g.m.some(y=>!sc(y.s))),foc=act<0?n-1:act;
 const cols=main.map((g,i)=>{
  const pr=i<n-1&&cnt[i]==2*cnt[i+1],li=i>0&&cnt[i-1]==2*cnt[i],
   fin=i==n-1&&(kind(g.r).k=='f'||(n>1&&cnt[i]==1)),
   done=g.m.filter(y=>sc(y.s)).length;
  return`<div class="bk-col" data-i="${i}"><div class="bk-h ${i==act?'act':''} ${fin?'fin':''}"><span><b>${fin?ic('cup'):''}${esc(rlab(g.r))}</b><em>${done}/${g.m.length}</em></span></div><div class="bk-b">${g.m.map((y,k)=>`<div class="bk-s ${pr?'c '+(k%2?'d':'u'):''} ${pr&&sc(y.s)?'dn':''}">${mt(y,{nx:y===nx,f:fin,li})}</div>`).join('')}</div></div>`}).join('');
 const t3=third.flatMap(g=>g.m),
  thirdHtml=t3.length?`<div class="bk-3"><div class="bk-h"><span><b>${esc(rlab(third[0].r))}</b></span></div>${t3.map(y=>`<div class="bk-s">${mt(y,{nx:y===nx})}</div>`).join('')}</div>`:'';
 return`<div class="bk-scroll" data-id="${esc(id)}" data-f="${foc}"><div class="bk" style="--n:${n}">${cols}${thirdHtml}</div></div>`};

/* ---------- группы ---------- */

(function(){var roots=[document.getElementById('v'),document.getElementById('m')].filter(Boolean),q=0;

function sched(){if(!q){q=1;requestAnimationFrame(fix)}}
roots.forEach(function(r){new MutationObserver(sched).observe(r,{childList:true,subtree:true});
