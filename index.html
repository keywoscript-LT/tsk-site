<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>TSK Esports — технический перерыв</title>
<style>
  :root{--bg:#07090E;--fg:#e8edf5;--mut:#8b94a7;--cy:#00F0FF;--pk:#FF2E63}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(900px 500px at 50% 0%,rgba(0,240,255,.12),transparent 60%),var(--bg);color:var(--fg);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .card{max-width:480px}
  .logo{font-size:44px;font-weight:900;letter-spacing:.08em}
  .logo span{color:var(--pk)}
  h1{font-size:22px;margin:18px 0 8px;color:var(--cy);text-transform:uppercase;letter-spacing:.06em}
  p{color:var(--mut);line-height:1.55;margin:6px 0}
  .en{font-size:14px;opacity:.8;margin-top:14px}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">TSK<span>/</span></div>
    <h1>Технический перерыв</h1>
    <p>Мы обновляем сайт. Скоро вернёмся — загляни позже.</p>
    <p class="en">Maintenance break. We are updating the site and will be back soon.</p>
  </div>
</body>
</html>
