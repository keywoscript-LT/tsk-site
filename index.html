async function appOk(id){const a=DB.apps.find(x=>x.id==id);if(!a||!confirm('Одобрить заявку и добавить на сайт?'))return;if(a.data.type=='edit')return editOk(a);const d=a.data,sd=({id,...x})=>x;let team=null,pl,tinv=false,fx=[];

pl=acc.map(x=>{const p=DB.players.find(y=>y.id==x.pid);return p&&{...p,team:tid}}).filter(Boolean);

else{const tid=uid();pl=d.players.map(x=>({id:uid(),nick:x.nick,country:x.country||d.country,team:tid,age:x.age,pps:0,kd:0,wr:0}));const ci=d.players.findIndex(x=>x.captain);team={id:tid,name:d.name,country:d.country,pps:0,w:0,l:0,manager:d.manager||'',academy:d.academy||'',logo:d.logo,captain:ci>=0?pl[ci].id:''};if(a.user_id)team.owner=a.user_id}
if(sb){const rows=[...(team?[{kind:'teams',id:team.id,data:sd(team)}]:[]),...pl.map(x=>({kind:'players',id:x.id,data:sd({...x})})),...fx.map(t=>({kind:'teams',id:t.id,data:sd({...t,captain:''})}))];let r=await sb.from('records').upsert(rows);if(r.error)return toast(r.error.message);if(tinv){r=await sb.from('invites').update({team_id:team.id}).eq('app_id',id).neq('status','cancelled');if(r.error)return toast(r.error.message)}r=await sb.from('applications').update({status:'approved'}).eq('id',id);if(r.error)return toast(r.error.message);await load()}else{if(team)DB.teams.push(team);pl.forEach(x=>{const i=DB.players.findIndex(y=>y.id==x.id);i<0?DB.players.push(x):DB.players[i]=x});fx.forEach(t=>t.captain='');if(tinv)(DB.inv||[]).filter(v=>v.app_id==a.id&&v.status!='cancelled').forEach(v=>v.team_id=team.id);a.status='approved';save()}

const RULES=[
['Общие положения','General','Регистрируясь на сайте, ты соглашаешься с этими правилами. Один человек — один аккаунт. Указывай о себе достоверные данные. Незнание правил от ответственности не освобождает.','By registering you agree to these rules. One person — one account. Provide truthful information. Not knowing the rules does not excuse a violation.'],
['Уважение к людям','Respect','Запрещены оскорбления игроков, стаффа, команд и организации, травля, угрозы, дискриминация по любому признаку, провокации и токсичное поведение — на сайте, в профиле и в связанных чатах. Оскорбление стаффа — одно из самых серьёзных нарушений.','Insults toward players, staff, teams or the organization, harassment, threats, discrimination of any kind, baiting and toxic behavior are forbidden — on the site, in profiles and in linked chats. Insulting staff is among the most serious violations.'],
['Честная игра','Fair play','Запрещены читы и сторонний софт, договорные матчи, накрутка статистики и очков, мультиаккаунты, обман администрации и выдача себя за стафф.','Cheats and third-party software, match-fixing, stat or points boosting, multiple accounts, deceiving staff and impersonating staff are forbidden.'],
['Профиль и контент','Profile & content','Ник, фото, логотип, название команды, био и цитата не должны содержать оскорблений, шок-контента, 18+, рекламы, чужих личных данных и имитации ников стаффа. Такой контент удаляется, а заявки на изменение отклоняются.','Nicks, photos, logos, team names, bios and quotes must not contain insults, shock content, 18+ material, ads, other people’s personal data or imitation of staff names. Such content is removed and edit requests are rejected.'],
['Команды и трансферы','Teams & transfers','Один аккаунт может зарегистрировать только одну команду и один профиль игрока. Запрещены спам приглашениями, давление на игроков и манипуляции при трансферах. Менеджер и капитан отвечают за поведение своей команды.','One account may register only one team and one player profile. Invitation spam, pressure on players and transfer manipulation are forbidden. Managers and captains are responsible for their team’s conduct.'],
['Наказания','Penalties','За нарушения стафф может вынести предупреждение, удалить контент или заблокировать аккаунт на срок от 1 часа до 30 дней, а за грубые и повторные нарушения — навсегда. Во время бана нельзя подавать заявки, менять профиль, отправлять и принимать приглашения. Срок и причина видны в твоём профиле.','Staff may issue a warning, remove content or ban an account from 1 hour to 30 days — permanently for severe or repeated violations. While banned you cannot apply, edit your profile, or send/accept invitations. The reason and duration are shown in your profile.'],
['Обжалование','Appeals','Если ты считаешь наказание ошибочным, свяжись со стаффом организации через официальные каналы и приведи факты. Решение по апелляции принимает администрация.','If you believe a penalty is a mistake, contact the organization’s staff through official channels with facts. Appeals are decided by the administration.']];

async function dbUpd(tbl,id,patch){if(sb){const{error}=await sb.from(tbl).update(patch).eq('id',id);if(error){toast(error.message);return false}await load()}else{const key={reports:'reps',appeals:'apls',warnings:'warns',bans:'bans'}[tbl],x=(DB[key]||[]).find(v=>v.id==id);if(x)Object.assign(x,patch);save()}return true}
async function dbDel(tbl,id){if(sb){const{error}=await sb.from(tbl).delete().eq('id',id);if(error){toast(error.message);return false}await load()}else{const key={warnings:'warns'}[tbl]||tbl;DB[key]=(DB[key]||[]).filter(v=>v.id!=id);save()}return true}
function reportForm(type,id){if(!S.me)return authModal();const x=type=='player'?DB.players.find(p=>p.id==id):DB.teams.find(v=>v.id==id);if(!x)return;if(x.uid&&x.uid==S.me.id||x.owner&&x.owner==S.me.id)return toast(R('Нельзя пожаловаться на себя','You cannot report yourself'));const nm=x.nick||x.name;

$('#RF').onsubmit=async e=>{e.preventDefault();const d=new FormData(e.target),row={from_uid:S.me.id,target_type:type,target_id:id,target_name:nm,reason:d.get('reason'),comment:String(d.get('comment')||'').trim().slice(0,300),status:'open'};

н','Ban')}</button>`:''}${op?`<button class="btn k" onclick="dbUpd('reports','${r.id}',{status:'resolved',handled_by:'${q1(S.user.email||S.user.id)}'}).then(render)"><svg class="ic" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.5 5 5L19.5 7"/></svg> ${R('Решено','Resolved')}</button><button class="btn k" onclick="dbUpd('reports','${r.id}',{status:'dismissed',handled_by:'${q1(S.user.email||S.user.id)}'}).then(render)"><svg class="ic" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6 6 18"/></svg> ${R('Отклонить','Dismiss')}</button>`:`<button class="btn r" onclick="dbDel('reports','${r.id}').then(render)">${ic('trash')}</button>`}</div></div>`}).join('')||`<p class="k-t5 text-sm">${R('Жалоб нет.','No reports.')}</p>`}</div>`}
function warnForm(pre){modal(`<form id="WF" class="grid gap-2.5 relative"><button type="button" class="absolute right-0 -top-1 btn k !p-1.5" onclick="closeM()">${ic('x')}</button><h3 class="font-head font-extrabold text-lg kc-gd pr-10"><svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2.6 22.3 20.6H1.7zM11 9v5.4h2V9zM12 16.1a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/></svg> ${R('Предупреждение','Warning')}</h3><p class="text-[12px] k-t4">${R('Каждое предупреждение — страйк. На '+STRIKE_MAX+'-м бан ставится автоматически.','Each warning is a strike. The '+STRIKE_MAX+'rd one triggers an automatic ban.')}</p><div class="rg-p grid gap-1.5"><label ${LB}>${R('Ник игрока','Player nick')}<input class="inp" name="pn" list="pnl" autocomplete="off" oninput="rgChk(this)" value="${esc(pre||'')}" required></label><div class="rg-s text-[11px] min-h-[14px]"></div></div><label ${LB}>${R('Причина','Reason')}<input class="inp" name="reason" list="brl" maxlength="200" required></label><button class="btn">${R('Выдать предупреждение','Issue warning')}</button>${pnl()}<datalist id="brl">${BAN_REASONS.map(x=>`<option value="${x}">`).join('')}</datalist></form>`);
if(pre)rgChk($('#WF [name=pn]'));
$('#WF').onsubmit=async e=>{e.preventDefault();const d=new FormData(e.target),pl_=pByNick(d.get('pn'));if(!pl_)return toast(R('Игрок не найден','Player not found'));if(!pl_.uid)return toast(R('У этого профиля нет аккаунта','This profile has no account'));
const row={user_id:pl_.uid,player_id:pl_.id,nick:pl_.nick,reason:String(d.get('reason')).trim().slice(0,200),by_email:S.user.email||S.user.id};
if(sb){const{error}=await sb.from('warnings').insert(row);if(error)return toast(error.message);await load()}
else{DB.warns.unshift({...row,id:uid(),created_at:new Date().toISOString(),consumed:false});if(strikes(pl_.uid)>=STRIKE_MAX){DB.warns.filter(w=>w.user_id==pl_.uid&&!w.revoked_at&&!w.consumed).forEach(w=>w.consumed=true);DB.bans.unshift({id:uid(),user_id:pl_.uid,player_id:pl_.id,nick:pl_.nick,reason:'Автобан: '+STRIKE_MAX+' предупреждения',until:new Date(Date.now()+AUTO_BAN_H*3600e3).toISOString(),by_email:'auto',created_at:new Date().toISOString()})}save()}
const auto=(DB.bans||[]).some(b=>b.user_id==pl_.uid&&b.by_email=='auto'&&!b.revoked_at&&b.until&&new Date(b.until)>new Date()&&Date.now()-new Date(b.created_at)<6e4);
closeM();toast(auto?R('3-е предупреждение — выдан автоматический бан','3rd warning — automatic ban issued'):R('Предупреждение выдано: ','Warning issued: ')+strikes(pl_.uid)+'/'+STRIKE_MAX);render()}}
const revokeWarn=id=>confirm(R('Снять предупреждение?','Revoke this warning?'))&&dbUpd('warnings',id,{revoked_at:new Date().toISOString()}).then(render),delWarn=id=>confirm(R('Удалить запись?','Delete this record?'))&&dbDel('warnings',id).then(render);
const punishItems=u=>{const L=[];(DB.bans||[]).filter(b=>b.user_id==u).forEach(b=>L.push({at:b.created_at,k:'ban',b}));(DB.warns||[]).filter(w=>w.user_id==u).forEach(w=>L.push({at:w.created_at,k:'warn',w}));(DB.apls||[]).filter(a=>a.user_id==u&&a.status!='open'&&a.decided_at).forEach(a=>L.push({at:a.decided_at,k:'apl',a}));return L.sort((x,y)=>new Date(y.at)-new Date(x.at))},
punRow=(it,staff)=>{if(it.k=='ban'){const b=it.b,act=!b.revoked_at&&(!b.until||new Date(b.until)>new Date());return`<div class="rounded-lg bw-04 px-2.5 py-2"><div class="flex items-center gap-2 text-sm"><span><svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 3a7 7 0 1 1 0 14 7 7 0 0 1 0-14z"/><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M6.4 6.4l11.2 11.2"/></svg></span><b class="flex-1">${R('Бан','Ban')} · ${banTxt(b)}</b><span class="text-[10px] font-bold uppercase" style="color:${act?'#FF2E63':'#6f7a8f'}">${act?R('активен','active'):b.revoked_at?R('снят','lifted'):R('истёк','expired')}</span></div><div class="text-[12px] k-t3 mt-0.5">${esc(b.reason||'—')}</div><div class="text-[11px] k-t5">${new Date(b.created_at).toLocaleDateString(S.lang)}${staff?' · '+esc(b.by_email||''):''}</div></div>`}
if(it.k=='warn'){const w=it.w;return`<div class="rounded-lg bw-04 px-2.5 py-2"><div class="flex items-center gap-2 text-sm"><span><svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2.6 22.3 20.6H1.7zM11 9v5.4h2V9zM12 16.1a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/></svg></span><b class="flex-1">${R('Предупреждение','Warning')}</b><span class="text-[10px] font-bold uppercase k-t4">${w.revoked_at?R('снято','revoked'):w.consumed?R('учтено в бане','used in ban'):R('действует','active')}</span></div><div class="text-[12px] k-t3 mt-0.5">${esc(w.reason||'—')}</div><div class="text-[11px] k-t5">${new Date(w.created_at).toLocaleDateString(S.lang)}${staff?' · '+esc(w.by_email||''):''}</div></div>`}
const a=it.a;return`<div class="rounded-lg bw-04 px-2.5 py-2"><div class="flex items-center gap-2 text-sm"><span><svg class="ic" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M12 4v16M7 20.5h10M4.5 7h15"/><path d="M1.8 14.5 4.5 7l2.7 7.5a2.7 2.7 0 0 1-5.4 0zM16.8 14.5 19.5 7l2.7 7.5a2.7 2.7 0 0 1-5.4 0z"/></svg></span><b class="flex-1">${R('Апелляция','Appeal')}: ${R(APL_T[a.status][0],APL_T[a.status][1])}</b></div>${a.decision_note?`<div class="text-[12px] k-t3 mt-0.5">${esc(a.decision_note)}</div>`:''}<div class="text-[11px] k-t5">${new Date(a.decided_at).toLocaleDateString(S.lang)}${staff?' · '+esc(a.handled_by||''):''}</div></div>`};

<script>
/* ===== v2: URL-роутинг, календарь, skeleton, a11y ===== */
(()=>{
$('#hl').src=L;
const ROUTES=['news','rank','players','matches','tourn','games','lfg','rules','about','privacy','terms'],
NK=new Set(ROUTES),o={go,openT,openP,ui,render},enc=encodeURIComponent;

const SITE=(()=>{const c=document.querySelector('link[rel=canonical]');try{const u=new URL(c.getAttribute('href'));return u.origin}catch(e){}return location.origin})();
const pathOf=(k,id)=>TSK_ROOT+(k=='news'&&!id?'':k+'/'+(id?enc(id)+'/':''));
const safeDec=x=>{try{return decodeURIComponent(x)}catch(e){return x}};
const rel=()=>safeDec(location.pathname).slice(TSK_ROOT.length).replace(/index\.html$/,'').replace(/^\/+|\/+$/g,'');
const parse=()=>{const p=rel().split('/');let k=p[0]||'',id=p.slice(1).join('/');
 if(!k){const m=location.hash.match(/^#\/([\w-]+)(?:\/(.+))?$/);if(m){k=m[1];id=m[2]?safeDec(m[2]):''}}
 return[k,id]};
const KNOWN=k=>NK.has(k)||k=='team'||k=='player';
const setH=h=>{cur=h;const m=h.match(/^#\/([\w-]+)(?:\/(.+))?$/);if(!m||!KNOWN(m[1]))return;
 const u=TSK_ROOT+'#/'+m[1]+(m[2]?'/'+m[2]:'');if(location.pathname+location.hash!==u){try{history.pushState(null,'',u)}catch(e){}}};

/* ---- мета-теги и JSON-LD текущей страницы ---- */
const strip=x=>String(x||'').replace(/\[[^\]]*\]/g,' ').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
const clip=(x,n)=>{x=strip(x);return x.length>n?x.slice(0,n-1).replace(/\s+\S*$/,'')+'…':x};
const PAGES=()=>({
 rank:[R('Рейтинг команд Brawl Stars — PPS','Brawl Stars team ranking — PPS'),R('Актуальный рейтинг команд по системе PPS: очки, победы, поражения и форма за последние матчи.','Current team ranking by PPS: points, wins, losses and recent form.')],
 players:[R('Игроки Brawl Stars — рейтинг и составы','Brawl Stars players — ranking and rosters'),R('Профили игроков: PPS, команды, страны и история переходов.','Player profiles: PPS, teams, countries and transfer history.')],
 matches:[R('Матчи Brawl Stars — расписание и результаты','Brawl Stars matches — schedule and results'),R('Расписание ближайших матчей, live-результаты и архив игр с прогнозами.','Upcoming schedule, live results and match archive with predictions.')],
 tourn:[R('Турниры Brawl Stars — сетки и победители','Brawl Stars tournaments — brackets and winners'),R('Турнирные сетки, групповые этапы, плей-офф и победители турниров.','Tournament brackets, group stages, playoffs and winners.')],
 games:[R('Мини-игры','Mini-games'),R('Мини-игры сообщества TSK Esports.','TSK Esports community mini-games.')],
 lfg:[R('Поиск команды Brawl Stars — игроки и составы','Find a Brawl Stars team — players and rosters'),R('Ищешь команду или игроков? Анкеты свободных игроков и команды, которые набирают состав.','Looking for a team or players? Free agents and teams that are recruiting.')],
 rules:[R('Правила турниров и сообщества','Tournament and community rules'),R('Правила участия в турнирах и поведения в сообществе TSK Esports.','Rules for tournaments and community conduct.')],
 about:[R('О TSK Esports','About TSK Esports'),R('Кто мы, чем занимаемся и как с нами связаться: игроки, партнёры, спонсоры.','Who we are, what we do and how to reach us: players, partners, sponsors.')],
 privacy:[R('Политика конфиденциальности','Privacy policy'),R('Какие данные мы собираем и как их используем.','What data we collect and how we use it.')],
 terms:[R('Условия использования','Terms of use'),R('Правила пользования сайтом TSK Esports.','Terms for using the TSK Esports website.')]});
function curMeta(){
 if(ENT&&ENT.k=='player'){const p=DB.players.find(z=>z.id==ENT.id);if(p){const tm=DB.teams.find(z=>z.id==p.team);
  return{k:'player',id:ENT.id,title:p.nick+R(' — игрок Brawl Stars',' — Brawl Stars player'),
   desc:p.nick+(tm?R(' играет за ',' plays for ')+tm.name+'. ':'. ')+(p.pps||0)+' PPS. '+R('Профиль игрока, команда и история переходов.','Player profile, team and transfer history.'),
   ld:{'@type':'Person',name:p.nick,url:SITE+pathOf('player',ENT.id),description:p.nick+' — Brawl Stars',memberOf:tm?{'@type':'SportsTeam',name:tm.name}:undefined}}}}
 if(ENT&&ENT.k=='news'){const n=DB.news.find(z=>z.id==ENT.id);if(n){
  return{k:'news',id:ENT.id,title:n.title||'TSK Esports',desc:clip(n.summary||n.body,155)||DESC0,
   img:/^https?:/.test(n.img||'')?n.img:'',

 if(S.tab=='team'&&S.tid){const x=DB.teams.find(z=>z.id==S.tid);if(x){
  return{k:'team',id:S.tid,title:x.name+R(' — состав, рейтинг PPS и матчи',' — roster, PPS rating and matches'),

   ld:{'@type':'SportsTeam',name:x.name,sport:'Brawl Stars',url:SITE+pathOf('team',S.tid),description:x.name+' — Brawl Stars'}}}
  return{k:'team',id:S.tid,title:R('Команда','Team'),desc:DESC0}}
 const P=PAGES()[S.tab];
 if(P&&NK.has(S.tab))return{k:S.tab,id:'',title:P[0],desc:P[1]};
 if(!NK.has(S.tab))return{k:'',id:'',title:TITLE0,desc:DESC0,noindex:true};
 return{k:'news',id:'',title:TITLE0,desc:DESC0,home:true}}
let _sig='';

 const full=m.home||m.title==TITLE0?TITLE0:m.title+' — TSK Esports';
 const sg=[full,m.desc,url,m.img,!!m.noindex].join('|');if(sg===_sig)return;_sig=sg;
 document.title=full;
 const set=(sel,attr,val)=>{const e=document.querySelector(sel);if(e)e.setAttribute(attr,val)};
 set('meta[name=description]','content',m.desc);
 set('link[rel=canonical]','href',url);
 set('meta[property="og:url"]','content',url);

 set('meta[property="og:description"]','content',m.desc);

 else{const d=SITE+TSK_ROOT+'og-image.png';set('meta[property="og:image"]','content',d);set('meta[name="twitter:image"]','content',d)}
 set('meta[name=robots]','content',m.noindex?'noindex,nofollow':'index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1');
 let ld=document.getElementById('ld-page');
 if(m.ld){if(!ld){ld=document.createElement('script');ld.type='application/ld+json';ld.id='ld-page';document.head.appendChild(ld)}
  ld.textContent=JSON.stringify(Object.assign({'@context':'https://schema.org'},m.ld))}
 else if(ld)ld.remove()}

<script>
(()=>{
/* ---------- переводы новых строк ---------- */
try{
 Object.assign(XL.uk,{'Следующий матч':'Наступний матч','Далее':'Далі','Матч за 3-е место':'Матч за 3-є місце','Полуфинал':'Півфінал','Четвертьфинал':'Чвертьфінал','1/8 финала':'1/8 фіналу','1/16 финала':'1/16 фіналу','Финал':'Фінал','Плей-офф':'Плей-оф','Сетка плей-офф':'Сітка плей-оф','Открыть':'Відкрити','Закрыть':'Закрити'});
 Object.assign(XL.kk,{'Следующий матч':'Келесі матч','Далее':'Келесі','Матч за 3-е место':'3-орын үшін матч','Полуфинал':'Жартылай финал','Четвертьфинал':'Ширек финал','1/8 финала':'1/8 финал','1/16 финала':'1/16 финал','Финал':'Финал','Плей-офф':'Плей-офф','Сетка плей-офф':'Плей-офф торы','Открыть':'Ашу','Закрыть':'Жабу'});
}catch(e){}

/* ---------- помощники ---------- */
const sc=s=>{const m=String(s==null?'':s).match(/(\d+)\D+(\d+)/);return m?[+m[1],+m[2]]:null};
const kind=r=>{const s=String(r||'');
 if(/third|3rd|бронз|3[\s-]*(е|й|го)?\s*мест|за\s*3/i.test(s))return{k:'3',w:90};
 if(/semi|полуфин|півфін|1\/2/i.test(s))return{k:'sf',w:60};
 if(/quarter|четверт|чвертьф|1\/4/i.test(s))return{k:'qf',w:50};
 if(/1\/16|round of 32|last 32/i.test(s))return{k:'r32',w:30};
 if(/1\/8|round of 16|last 16/i.test(s))return{k:'r16',w:40};
 if(/^\s*(grand\s*)?(final|финал|фінал)\s*$/i.test(s))return{k:'f',w:80};
 return{k:'',w:null}};
const rlab=r=>{const k=kind(r).k;
 return k=='3'?R('Матч за 3-е место','Third place'):k=='sf'?R('Полуфинал','Semifinal'):k=='qf'?R('Четвертьфинал','Quarterfinal'):k=='r32'?R('1/16 финала','Round of 32'):k=='r16'?R('1/8 финала','Round of 16'):k=='f'?R('Финал','Final'):String(r||'')};
const split=po=>{const rs=[];po.forEach(y=>{let g=rs.find(z=>z.r==y.r);if(!g)rs.push(g={r:y.r,m:[]});g.m.push(y)});
 let third=rs.filter(g=>kind(g.r).k=='3'),main=rs.filter(g=>kind(g.r).k!='3');
 if(!main.length){main=third;third=[]}
 if(main.length>1&&main.every(g=>kind(g.r).w!=null))main.sort((a,b)=>kind(a.r).w-kind(b.r).w);
 return{main,third}};
const oc=T=>T?`onclick="openT('${esc(String(T.id))}')"`:'';

/* ---------- матч в сетке ---------- */
const row=(n,v,st,extra)=>{const tt=tnm(n);
 return`<div class="bk-t ${st}" data-tn="${esc(n)}" ${oc(tt)}>${lg(tt||{name:n},'h-5 w-5')}<span class="n">${esc(n)}</span>${extra||''}<b class="sc">${v}</b></div>`};
const mt=(y,o)=>{const p=sc(y.s),wa=p&&p[0]>p[1],wb=p&&p[1]>p[0],cup=`<span class="tr">${ic('cup')}</span>`;
 return`<div class="bk-m ${o.nx?'nx':''} ${o.f?'fin':''} ${o.li?'li':''}">${o.nx?`<i class="bk-tag">${R('Далее','Next')}</i>`:''}${row(y.a,p?p[0]:'–',wa?'w':wb?'l':'',wa&&o.f?cup:'')}${row(y.b,p?p[1]:'–',wb?'w':wa?'l':'',wb&&o.f?cup:'')}</div>`};

/* ---------- сетка ---------- */
const bracket=(id,po,nx)=>{
 const{main,third}=split(po),n=main.length,cnt=main.map(g=>g.m.length);
 if(!n)return`<p class="tn-empty">${t('none')}</p>`;
 const act=main.findIndex(g=>g.m.some(y=>!sc(y.s))),foc=act<0?n-1:act;
 const cols=main.map((g,i)=>{
  const pr=i<n-1&&cnt[i]==2*cnt[i+1],li=i>0&&cnt[i-1]==2*cnt[i],
   fin=i==n-1&&(kind(g.r).k=='f'||(n>1&&cnt[i]==1)),
   done=g.m.filter(y=>sc(y.s)).length;
  return`<div class="bk-col" data-i="${i}"><div class="bk-h ${i==act?'act':''} ${fin?'fin':''}"><span><b>${fin?ic('cup'):''}${esc(rlab(g.r))}</b><em>${done}/${g.m.length}</em></span></div><div class="bk-b">${g.m.map((y,k)=>`<div class="bk-s ${pr?'c '+(k%2?'d':'u'):''} ${pr&&sc(y.s)?'dn':''}">${mt(y,{nx:y===nx,f:fin,li})}</div>`).join('')}</div></div>`}).join('');
 const t3=third.flatMap(g=>g.m),
  thirdHtml=t3.length?`<div class="bk-3"><div class="bk-h"><span><b>${esc(rlab(third[0].r))}</b></span></div>${t3.map(y=>`<div class="bk-s">${mt(y,{nx:y===nx})}</div>`).join('')}</div>`:'';
 return`<div class="bk-scroll" data-id="${esc(id)}" data-f="${foc}"><div class="bk" style="--n:${n}">${cols}${thirdHtml}</div></div>`};

/* ---------- группы ---------- */
const groups=gr=>{
 if(!gr.length)return`<p class="tn-empty">${t('none')}</p>`;
 const badge=g=>{const w=String(g.n||'').trim().split(/\s+/),l=w[w.length-1]||'?';return esc((l.length<=2?l:l[0]).toUpperCase())};
 return`<div class="tn-gg">${gr.map(g=>{const ts=g.teams||[];
  return`<div class="tn-g"><div class="tn-gh"><span class="tn-gl">${badge(g)}</span><b>${esc(g.n)}</b><span class="k">PPS</span></div>${ts.map((n,k)=>{const tt=tnm(n),q=k<2,pps=tt&&tt.pps!==''&&tt.pps!=null&&isFinite(+tt.pps)?+(+tt.pps).toFixed(1):null;
   return`<div class="tn-gr ${q?'q':''}" ${oc(tt)}><span class="i">${k+1}</span>${lg(tt||{name:n},'h-6 w-6')}<span class="n">${esc(n)}</span>${q?'<span class="po">PO</span>':''}${pps!=null?`<span class="r">${pps}</span>`:''}</div>`}).join('')}</div>`}).join('')}</div><div class="tn-leg"><b>PO</b> — ${R('выходят в плей-офф','advance to playoffs')}</div>`};

/* ---------- данные турнира ---------- */
const info=x=>{const sk=tsK(x.status),po=x.po||[],gr=x.groups||[],{main}=split(po),played=po.filter(y=>sc(y.s)).length;
 let cw=x.winner&&DB.teams.find(z=>z.id==x.winner)||null;
 if(!cw&&main.length){const lm=main[main.length-1];
  if(lm.m.length==1&&(main.length>1||kind(lm.r).k=='f')){const p=sc(lm.m[0].s);if(p&&p[0]!=p[1]){const nm=p[0]>p[1]?lm.m[0].a:lm.m[0].b;cw=tnm(nm)||{name:nm}}}}
 let nx=null;
 if(sk!='fin'&&!cw)for(const g of main){nx=g.m.find(y=>!sc(y.s));if(nx)break}
 return{sk,po,gr,main,played,cw,nx}};
const tagOf=sk=>sk=='live'?`<span class="tn-tag"><i class="tn-dot"></i>LIVE</span>`:sk=='fin'?`<span class="tn-tag">${R('Завершён','Finished')}</span>`:`<span class="tn-tag">${R('Скоро','Upcoming')}</span>`;
const champOf=cw=>`<div class="tn-champ" ${oc(cw.id?cw:null)}>${lg(cw,'h-10 w-10')}<div><small>${R('Победитель','Champion')}</small><b>${esc(cw.name)}</b></div>${ic('cup')}</div>`;

/* ---------- карточка турнира ---------- */
const card=(x,i,solo)=>{
 const{sk,po,gr,played,cw,nx}=info(x),id=String(x.id),
  names=new Set([...gr.flatMap(g=>g.teams||[]),...po.flatMap(y=>[y.a,y.b])].filter(Boolean)),
  op=(S.tx||{})[id]!=null?(S.tx||{})[id]:(solo||sk!='fin'),
  kv=[names.size?[names.size,R('команд','teams')]:null,gr.length?[gr.length,t('groups')]:null,po.length?[played+'/'+po.length,R('матчей','matches')]:null].filter(Boolean),
  stats=kv.length?`<div class="tn-kv">${kv.map(c=>`<div><b>${c[0]}</b><span>${c[1]}</span></div>`).join('')}</div>`:'',
  prog=po.length?`<div class="tn-pgh"><span>${t('po')}</span><b>${played}/${po.length}</b></div>`+(po.length<=24?`<div class="tn-pg">${po.map((y,k)=>`<i class="${k<played?'on':''}"></i>`).join('')}</div>`:`<div class="tn-pg bar"><i style="width:${Math.round(100*played/po.length)}%"></i></div>`):'',
  nextT=nx?(()=>{const A=tnm(nx.a),B=tnm(nx.b),a=`<div ${oc(A)}><span>${esc(nx.a)}</span>${lg(A||{name:nx.a},'h-8 w-8')}</div>`,b=`<div ${oc(B)}>${lg(B||{name:nx.b},'h-8 w-8')}<span>${esc(nx.b)}</span></div>`;
   return`<div class="tn-next"><div class="tn-nl"><small>${R('Следующий матч','Next match')}</small><b>${esc(rlab(nx.r))}</b></div><div class="tn-vs">${a}<em>VS</em>${b}</div></div>`})():'',
  bkBtn=po.length?`<button class="tn-bkb" onclick="tnOpen('${esc(id)}')"><span class="ib">${ic('tourn')}</span><span class="tx"><b>${R('Сетка плей-офф','Playoff bracket')}</b><small>${nx?esc(rlab(nx.r))+' · ':''}${played}/${po.length} ${R('матчей','matches')}</small></span><span class="go"><span>${R('Открыть','Open')}</span>${ic('ne')}</span></button>`:'',
  body=gr.length?`<div class="tn-body"><div class="tn-sec"><span>${t('groups')}</span></div>${groups(gr)}</div>`:'',
  tog=body?`<button class="tn-tg" onclick="(S.tx=S.tx||{})['${esc(id)}']=${!op};render()">${op?R('Свернуть','Collapse')+ic('up'):R('Подробнее','Details')+ic('dn')}</button>`:'';
 return`<section class="tn tn-${sk} fd" style="animation-delay:${Math.min(i,6)*70}ms"><div class="tn-hero"><span class="tn-wm">${ic('cup')}</span>${tagOf(sk)}<h2 class="tn-name font-head">${esc(x.name)}</h2>${stats}${prog}</div>${cw?champOf(cw):''}${nextT}${bkBtn}${window.tpBox?tpBox(x,sk):''}${op?body:''}${tog}</section>`};

/* ---------- окно с сеткой ---------- */
const paintOv=()=>{const ov=document.getElementById('tn-ov');if(!ov)return;
 const x=DB.tourn.find(z=>String(z.id)==window.__tnOv);if(!x){tnClose();return}
 const{sk,po,played,cw,nx}=info(x),old=ov.querySelector('.tn-ovb'),st=old?old.scrollTop:0;
 ov.className='tn-page tn-ov tn-'+sk;
 ov.innerHTML=`<div class="tn-ovh"><div class="tn-ovt">${tagOf(sk)}<h2 class="tn-ovn font-head">${esc(x.name)}</h2></div><div class="tn-ovp">${played}/${po.length}<small>${R('матчей','matches')}</small></div><button class="tn-ovx" aria-label="${R('Закрыть','Close')}" onclick="tnClose()">${ic('x')}</button></div><div class="tn-ovb">${cw?champOf(cw):''}${bracket(String(x.id),po,nx)}</div>`;
 const nb=ov.querySelector('.tn-ovb');if(nb)nb.scrollTop=st};
window.tnOpen=id=>{window.__tnOv=String(id);delete pos[String(id)];
 let ov=document.getElementById('tn-ov');
 if(!ov){ov=document.createElement('div');ov.id='tn-ov';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');document.body.appendChild(ov);document.documentElement.style.overflow='hidden'}
 paintOv();fixScroll();const c=ov.querySelector('.tn-ovx');if(c)c.focus()};
window.tnClose=()=>{const ov=document.getElementById('tn-ov');if(ov)ov.remove();window.__tnOv=null;document.documentElement.style.overflow=''};
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&window.__tnOv)tnClose()});

/* ---------- вкладка ---------- */
V.tourn=q=>{
 const f=S.tf||'all',l=DB.tourn.filter(x=>has(q,x.name)),ord={live:0,up:1,fin:2},cn=k=>l.filter(x=>tsK(x.status)==k).length,
  sh=l.filter(x=>f=='all'||tsK(x.status)==f).sort((a,b)=>ord[tsK(a.status)]-ord[tsK(b.status)]),
  fb=(on,v,lab,n,dot)=>`<button class="${on?'on':''}" onclick="S.tf='${v}';render()">${dot?'<i class="tn-dot"></i>':''}${lab}<em>${n}</em></button>`;
 return`<div class="tn-page"><h1 class="font-head font-black text-2xl uppercase tracking-wide mt-1">${t('tourn')} <span class="kc-rd">/</span> <span class="k-t5 text-base">${l.length}</span></h1>`
 +(l.length>1?`<div class="tn-flt">${fb(f=='all','all',R('Все','All'),l.length)}${fb(f=='live','live','LIVE',cn('live'),cn('live'))}${fb(f=='up','up',R('Скоро','Soon'),cn('up'))}${fb(f=='fin','fin',R('Завершённые','Finished'),cn('fin'))}</div>`:'')
 +(sh.map((x,i)=>card(x,i,l.length==1)).join('')||`<div class="tn-none">${ic('cup')}${t('none')}</div>`)+`</div>`};

/* ---------- интерактив ---------- */
document.addEventListener('mouseover',e=>{const el=e.target.closest&&e.target.closest('.bk-t[data-tn]');if(!el)return;
 const n=el.dataset.tn;el.closest('.bk').querySelectorAll('.bk-t[data-tn]').forEach(z=>z.classList.toggle('hl',z.dataset.tn===n))});
document.addEventListener('mouseout',e=>{const el=e.target.closest&&e.target.closest('.bk-t[data-tn]');if(!el)return;
 el.closest('.bk').querySelectorAll('.bk-t.hl').forEach(z=>z.classList.remove('hl'))});
const pos=window.__tnPos=window.__tnPos||{};
document.addEventListener('scroll',e=>{const el=e.target;if(el&&el.classList&&el.classList.contains('bk-scroll'))pos[el.dataset.id]=el.scrollLeft},true);
const fixScroll=()=>document.querySelectorAll('.bk-scroll').forEach(el=>{
 const id=el.dataset.id;
 if(pos[id]!=null){el.scrollLeft=pos[id];return}
 const c=el.querySelector('.bk-col[data-i="'+el.dataset.f+'"]');
 if(c&&el.scrollWidth>el.clientWidth)el.scrollLeft=Math.max(0,c.offsetLeft-22)});
const _r=window.render;
window.render=function(){const r=_r.apply(this,arguments);try{if(window.__tnOv)paintOv();fixScroll()}catch(e){}return r};
const _o=window.openT;
if(typeof _o=='function')window.openT=function(){tnClose();return _o.apply(this,arguments)};
})();
</script>

if(on&&window.TSKR){window.openNews=function(id){on(id);var n=(DB.news||[]).find(function(x){return x.id==id});if(n){TSKR.ent({k:'news',id:id});TSKR.setH('#/news/'+encodeURIComponent(id));TSKR.seo()}}}
var a=document.querySelector('header>div>a');if(a)a.href=TSK_ROOT;

<script>
/* свёртываемые блоки на странице «Матчи»: приватные лиги, MVP, прогнозы, серия */
(()=>{
const K='tsk_cz',st=(()=>{try{return JSON.parse(localStorage.getItem(K))||{}}catch{return{}}})(),save=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch{}};
const css=document.createElement('style');
css.textContent='.cz-b{flex-shrink:0;margin-left:auto;width:32px;height:32px;border-radius:10px;display:inline-grid;place-items:center;background:rgba(127,127,127,.16);color:inherit;transition:background .2s,transform .2s}.cz-b:active{transform:scale(.92)}.cz-b svg{width:16px;height:16px;transition:transform .25s}.cz-c .cz-b svg{transform:rotate(-90deg)}.cz-c>:not(:first-child){display:none!important}section[data-cz=mvp]>:first-child{display:flex;align-items:center;gap:8px}';
document.head.appendChild(css);
const chev='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
window.czT=b=>{const s=b.closest('section'),k=s.dataset.cz,c=s.classList.toggle('cz-c');st[k]=c?1:0;save();b.setAttribute('aria-expanded',c?'false':'true')};
const keyOf=(t,i)=>{t=t.slice(0,80).toLowerCase();return /приват|private/.test(t)?'lg':/mvp/.test(t)?'mvp':/серия|streak/.test(t)?'streak':/прогноз|predict/.test(t)?'pred':'x'+i};
const wrap=html=>{let i=html.indexOf('</h1>');if(i<0)return html;i+=5;const head=html.slice(0,i);let out='',n=0,rest=html.slice(i);
 for(;;){const m=rest.match(/^\s*<section class="g mb-3/);if(!m)break;const e=rest.indexOf('</section>');if(e<0)break;const blk=rest.slice(0,e+10);rest=rest.slice(e+10);
  const t=document.createElement('template');t.innerHTML=blk.trim();const sec=t.content.firstElementChild;if(!sec){out+=blk;continue}
  const k=keyOf(sec.textContent.trim(),n++);sec.dataset.cz=k;const f=sec.firstElementChild;
  if(f){if(k=='mvp'){const w=document.createElement('div');w.className='min-w-0 flex-1';while(f.firstChild)w.appendChild(f.firstChild);f.appendChild(w)}
   const b=document.createElement('button');b.type='button';b.className='cz-b';b.setAttribute('aria-label','Свернуть / развернуть');b.setAttribute('aria-expanded',st[k]?'false':'true');b.setAttribute('onclick','czT(this)');b.innerHTML=chev;f.appendChild(b)}
  if(st[k])sec.classList.add('cz-c');out+=sec.outerHTML}
 return head+out+rest};
const _m=V.matches;V.matches=q=>wrap(_m(q));
})();
</script>
</body></html>
